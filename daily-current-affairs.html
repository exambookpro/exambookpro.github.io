<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Current Affairs Test</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:auto;padding:20px;background:#f7f8fb}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #0001}.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:#111;color:#fff;text-decoration:none}</style></head><body><div class="card"><h1>Daily Current Affairs</h1><p>Daily competitive-exam current affairs tests with Hindi + English questions.</p></div><div id="list"></div><script>const U='https://abgigsjhdvsqehgdhbym.supabase.co',K='sb_publishable_GGcJmjwLXRrYsX8-sYph_g_Gt-0riU_',sb=supabase.createClient(U,K);async function load(){const {data,error}=await sb.from('tests').select('id,title,description,duration_minutes').eq('exam','Daily Current Affairs').order('id',{ascending:false}).limit(30);const el=document.getElementById('list');if(error){el.innerHTML='<div class="card">Unable to load tests.</div>';return}el.innerHTML=(data||[]).map(t=>'<div class="card"><h2>'+esc(t.title)+'</h2><p>'+esc(t.description||'')+'</p><a class="btn" href="verified-test.html?test='+t.id+'">Start Test</a></div>').join('')||'<div class="card">No tests available.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
