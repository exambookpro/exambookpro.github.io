<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamBook Pro — My Profile</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 28px}.brand{font-size:24px;font-weight:900}.brand span{color:#2563eb}.wrap{max-width:700px;margin:45px auto;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:30px;box-shadow:0 8px 25px #0000000b}.avatar{width:80px;height:80px;border-radius:50%;background:#dbeafe;color:#2563eb;display:grid;place-items:center;font-size:34px;font-weight:900;margin:0 auto 18px}.title{text-align:center;font-size:28px;font-weight:900;margin-bottom:25px}.row{padding:15px 0;border-bottom:1px solid #e5e7eb}.label{font-size:12px;color:#64748b;font-weight:700;margin-bottom:5px}.value{font-size:17px;font-weight:800}.actions{display:flex;gap:12px;margin-top:25px}.btn{flex:1;text-align:center;text-decoration:none;border:0;border-radius:8px;padding:12px;font-weight:800;cursor:pointer}.home{background:#2563eb;color:#fff}.logout{background:#fee2e2;color:#991b1b}.msg{text-align:center;color:#64748b;padding:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:25px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:18px;text-align:center}.stat b{display:block;font-size:25px;color:#2563eb}.stat span{font-size:12px;color:#64748b}@media(max-width:650px){.top{padding:0 15px}.wrap{margin:20px auto;padding:12px}.card{padding:22px}.stats{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand">📚 <span>ExamBook</span> Pro</div></header><main class="wrap"><section class="card"><div id="loading" class="msg">Profile loading...</div><div id="profile" style="display:none"><div id="avatar" class="avatar">👤</div><div class="title">My Profile</div><div class="row"><div class="label">NAME</div><div id="name" class="value">—</div></div><div class="row"><div class="label">EMAIL</div><div id="email" class="value">—</div></div><div class="stats"><div class="stat"><b id="attempted">0</b><span>Tests Attempted</span></div><div class="stat"><b id="avg">0%</b><span>Average Accuracy</span></div><div class="stat"><b id="best">0%</b><span>Best Accuracy</span></div><div class="stat"><b id="score">0</b><span>Total Marks</span></div></div><div class="row"><div class="label">RECENT TESTS</div><div id="history" class="value" style="font-size:14px;font-weight:600;line-height:1.7">No tests attempted yet.</div></div><div class="actions"><a class="btn home" href="index.html">← Home</a><button id="logout" class="btn logout">Logout</button></div></div></section></main><script>const SUPABASE_URL="https://abgigsjhdvsqehgdhbym.supabase.co";const SUPABASE_KEY="sb_publishable_GGcJmjwLXRrYsX8-sYph_g_Gt-0riU_";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);async function loadProfile(){const {data}=await sb.auth.getSession();if(!data.session){location.href='auth.html';return}const user=data.session.user;const name=user.user_metadata?.full_name||'User';document.getElementById('name').textContent=name;document.getElementById('email').textContent=user.email||'';document.getElementById('avatar').textContent=(name.trim()[0]||'👤').toUpperCase();let rows=[];try{const q=await sb.from('test_results').select('test_title,score,total_questions,attempted,correct,wrong,skipped,accuracy,is_verified,created_at').order('created_at',{ascending:false}).limit(50);if(!q.error)rows=q.data||[]}catch(e){}if(!rows.length){const stats=JSON.parse(localStorage.getItem('examStats')||'{}');rows=(Array.isArray(stats.history)?stats.history:[]).map(v=>({test_title:v.title,score:Number(v.score)||0,total_questions:Number(v.total)||0,accuracy:v.accuracy,created_at:v.date}));}const count=rows.length;let totalPct=0,bestPct=0,totalMarks=0;rows.forEach(r=>{const pct=Number.isFinite(Number(r.accuracy))?Number(r.accuracy):(Number(r.total_questions)>0?(Number(r.score)/Number(r.total_questions))*100:0);totalPct+=pct;bestPct=Math.max(bestPct,pct);totalMarks+=Number(r.score)||0});document.getElementById('attempted').textContent=count;document.getElementById('avg').textContent=count?Math.round(totalPct/count)+'%':'0%';document.getElementById('best').textContent=count?Math.round(bestPct)+'%':'0%';document.getElementById('score').textContent=Number.isFinite(totalMarks)?Math.round(totalMarks*100)/100:0;var h=document.getElementById('history');h.innerHTML=count?rows.slice(0,10).map(function(v){var pct=Number.isFinite(Number(v.accuracy))?Math.round(Number(v.accuracy))+'%':(v.total_questions?(Math.round((Number(v.score)/Number(v.total_questions))*100))+'%':'—');return '<div>• '+String(v.test_title||'Test').replace(/[<>&]/g,function(ch){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[ch]})+' — '+(v.score??0)+' / '+(v.total_questions??'—')+' ('+pct+') '+(v.is_verified?'✅ Verified':'')+'</div>'}).join(''):'No tests attempted yet.';document.getElementById('loading').style.display='none';document.getElementById('profile').style.display='block'}document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};loadProfile();</script></body></html>
