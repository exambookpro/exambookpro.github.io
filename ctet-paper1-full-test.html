let cur=0,ans=Array(150).fill(null),remaining=9000,running=true;
function renderTabs(){document.getElementById('tabs').innerHTML=S.map((x,i)=>`<button class="tab ${Math.floor(cur/30)===i?'active':''}" onclick="jump(${i*30})">${x[0]}<br><span class="sub">${x[1]}</span></button>`).join('')}
function getText(x){let l=document.getElementById('lang').value;if(l==='en')return x.en;if(l==='hi')return x.hi;return x.en+'<br><span class="muted">'+x.hi+'</span>'}
function render(){let x=A[cur];renderTabs();let lang=document.getElementById('lang').value;let opts=lang==='en'?x.oe:lang==='hi'?x.oh:x.oe.map((v,i)=>v+'<br><span class="muted">'+x.oh[i]+'</span>');document.getElementById('question').innerHTML=`<div class="section">Section ${Math.floor(cur/30)+1}: ${x.s} — ${S.find(v=>v[0]===x.s)[1]}</div><div class="qno">Question ${cur+1} of 150</div><div class="q">${getText(x)}</div><div>${opts.map((o,i)=>`<label class="opt"><input type="radio" name="opt" ${ans[cur]===i?'checked':''} onchange="ans[cur]=${i};renderPalette()"> <b>${String.fromCharCode(65+i)}.</b> ${o}</label>`).join('')}</div>`;renderPalette();window.scrollTo({top:0,behavior:'smooth'})}
function renderPalette(){let h='';for(let s=0;s<5;s++){h+=`<div class="section">${S[s][0]} • Q${s*30+1}–${s*30+30}</div><div class="palette">`;for(let i=s*30;i<s*30+30;i++)h+=`<button class="p ${i===cur?'current ':''}${ans[i]!==null?'answered':''}" onclick="jump(${i})">${i+1}</button>`;h+='</div>'}document.getElementById('palette').innerHTML=h}
function jump(i){cur=i;render()}function prevQ(){if(cur>0){cur--;render()}}function nextQ(){if(cur<149){cur++;render()}else submitTest()}
function submitTest(){if(!running)return;if(!confirm('क्या आप टेस्ट submit करना चाहते हैं? / Submit the test?'))return;running=false;let correct=ans.reduce((n,v,i)=>n+(v===A[i].a?1:0),0),attempt=ans.filter(v=>v!==null).length;document.getElementById('layout').style.display='none';let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<div class="score">${correct} / 150</div><h2>Test Submitted</h2><p>Correct: ${correct} • Wrong: ${attempt-correct} • Not Answered: ${150-attempt}</p><p>Percentage: ${(correct/150*100).toFixed(2)}%</p><button class="btn" onclick="location.reload()">Retake Test</button>`}
function tick(){if(!running)return;remaining--;let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(remaining<=0){alert('Time is over. Test will be submitted.');submitTest();return}setTimeout(tick,1000)}
render();tick();
