name: Fix Science Question Text

on:
  push:
    paths:
      - 'science-tests.html'
      - '.github/workflows/fix-science-question-text.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove question instruction prefixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('science-tests.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('const stems=')
          end = s.find('const mocks=', start)
          if start != -1 and end != -1:
              replacement = "const bank2=[];for(let i=0;i<1500;i++){let b=bank[i%bank.length];bank2.push({hi:b[0],en:b[1],opts:[b[2],b[4][0],b[4][2],b[4][4]],a:0,id:'SCI-'+i})}\n"
              s = s[:start] + replacement + s[end:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add science-tests.html
          git rm .github/workflows/fix-science-question-text.yml
          git diff --cached --quiet && exit 0 || true
          git commit -m 'Fix science question text prefixes'
          git push
