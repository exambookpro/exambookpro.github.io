<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamBook Pro — Mock Test</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#312e81,#2563eb);color:#fff;padding:12px 18px}.bar{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:900;font-size:19px}.timer{background:#fff;color:#111827;border-radius:8px;padding:9px 13px;font-weight:900}.wrap{max-width:1400px;margin:auto;padding:16px}.layout{display:grid;grid-template-columns:1fr 310px;gap:16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000a}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.muted{color:#64748b;font-size:13px}.select,.btn{border:1px solid #cbd5e1;border-radius:8px;padding:10px 13px;font-weight:800}.btn{cursor:pointer;background:#2563eb;color:#fff;border:0}.gray{background:#64748b}.red{background:#dc2626}.green{background:#16a34a}.section{background:#eef2ff;color:#3730a3;border-radius:8px;padding:9px;font-weight:800;margin:15px 0}.qno{font-size:13px;color:#64748b;font-weight:800}.q{font-size:21px;line-height:1.6;margin:10px 0 18px}.opt{display:block;border:1px solid #dbe3ef;border-radius:10px;padding:13px;margin:9px 0;cursor:pointer}.opt:hover{background:#f8fafc}.opt input{margin-right:9px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.p{height:36px;border:1px solid #94a3b8;background:#fff;border-radius:6px;cursor:pointer}.p.current{background:#2563eb;color:#fff}.p.answered{background:#16a34a;color:#fff}.legend{font-size:12px;color:#64748b;line-height:1.7}.result{display:none}.score{font-size:44px;font-weight:900;color:#2563eb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:15px;text-align:center}.stat b{display:block;font-size:25px}.review{margin-top:18px;text-align:left}.reviewItem{border:1px solid #e2e8f0;border-radius:10px;padding:13px;margin:9px 0}.correct{border-left:5px solid #16a34a}.wrong{border-left:5px solid #dc2626}.skip{border-left:5px solid #f59e0b}.cover{position:fixed;inset:0;background:#0f172acc;z-index:50;display:none;align-items:center;justify-content:center}.coverbox{background:#fff;border-radius:16px;padding:28px;text-align:center}.home{color:#fff;text-decoration:none;font-weight:800}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}.q{font-size:18px}}@media(max-width:600px){.stats{grid-template-columns:1fr}.actions{flex-wrap:wrap}.actions .btn{flex:1}}
</style></head><body><header class="top"><div class="bar"><a class="home" href="all-exam-mocks.html">← All Mock Tests</a><div class="title" id="title"></div><div class="timer">⏱️ <span id="timer">30:00</span></div></div></header><main class="wrap"><div id="testView" class="layout"><section class="card"><div class="head"><div><b>30 Questions • 30 Marks</b><div id="meta" class="muted"></div></div><select id="lang" class="select" onchange="render()"><option value="both">English + Hindi</option><option value="hi">Hindi</option><option value="en">English</option></select></div><div id="section" class="section"></div><div id="question"></div><div class="actions"><button class="btn gray" onclick="prevQ()">← Previous</button><button class="btn" onclick="nextQ()">Save & Next →</button></div></section><aside class="card side"><h3>📋 Question Palette</h3><div class="legend">🟢 Answered &nbsp; 🔵 Current &nbsp; ⚪ Not Answered</div><div id="palette" class="palette"></div><button class="btn" style="width:100%;margin-top:15px;background:#f59e0b" id="pause" onclick="pauseTest()">⏸ Pause</button><button class="btn green" style="width:100%;margin-top:8px;display:none" id="resume" onclick="resumeTest()">▶ Resume</button><button class="btn red" style="width:100%;margin-top:8px" onclick="submitTest()">Submit Test</button></aside></div><section id="result" class="card result"></section></main><div id="cover" class="cover"><div class="coverbox"><h2>⏸ Test Paused</h2><p>Timer paused है। Resume दबाकर test जारी करें।</p><button class="btn" onclick="resumeTest()">▶ Resume Test</button></div></div>
<script>
const cfg={
'railway-ntpc':['RRB NTPC','🚆','Maths • Reasoning • General Awareness • Science'],
'railway-groupd':['RRB Group D','🚆','Maths • Reasoning • General Science • General Awareness'],
'ssc-chsl':['SSC CHSL','📝','English • Quant • Reasoning • General Awareness'],
'ssc-cgl':['SSC CGL','📝','Reasoning • Quant • English • General Awareness'],
'ssc-mts':['SSC MTS','📝','Numerical Ability • Reasoning • GA • English'],
'bihar-police-constable':['Bihar Police Constable','👮','GK/GS • Bihar GK • Maths • Reasoning'],
'bihar-police-si':['Bihar Police SI','👮','GK/GS • Bihar GK • Reasoning'],
'bpsc-cce':['BPSC CCE Prelims','🏛️','General Studies • History • Geography • Polity • Science • Bihar']};
const params=new URLSearchParams(location.search),exam=params.get('exam')||'ssc-chsl',mock=Math.max(1,Math.min(10,Number(params.get('mock'))||1)),info=cfg[exam]||cfg['ssc-chsl'];
document.getElementById('title').textContent=`${info[1]} ${info[0]} — Mock Test ${mock}`;document.getElementById('meta').textContent=info[2];
function rng(seed){let x=seed>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}const r=rng(9000+mock*731+exam.length*97);function pick(a,n){let b=[...a],o=[];while(o.length<n)o.push(b.splice(Math.floor(r()*b.length),1)[0]);return o}
function q(hi,en,opts,a,s){return{hi,en,opts,a,s}}
function bank(){let B=[];
for(let i=0;i<90;i++){let a=11+i*3+mock,b=7+(i%17),c=a+b;B.push(q(`${a} + ${b} = ?`,`What is ${a} + ${b}?`,[String(c),String(c+2),String(c-2),String(c+5)],0,'Quantitative Aptitude'))}
for(let i=0;i<60;i++){let a=80+i*2,b=20+(i%10),c=a-b;B.push(q(`${a} में से ${b} घटाने पर क्या मिलेगा?`,`What is ${a} - ${b}?`,[String(c),String(c+5),String(c-5),String(c+10)],0,'Quantitative Aptitude'))}
for(let i=0;i<60;i++){let a=4+(i%16),b=3+(i%9),c=a*b;B.push(q(`${a} × ${b} = ?`,`What is ${a} × ${b}?`,[String(c),String(c+1),String(c-1),String(c+5)],0,'Quantitative Aptitude'))}
for(let i=0;i<45;i++){let a=5+i,b=a+5,c=b+5;B.push(q(`श्रृंखला ${a}, ${b}, ${c}, ? में अगली संख्या क्या है?`,`Find the next number: ${a}, ${b}, ${c}, ?`,[String(c+5),String(c+3),String(c+10),String(c+1)],0,'Reasoning'))}
for(let i=0;i<45;i++){let word=['CAT','DOG','BAT','SUN','PEN'][i%5],shift=1+(i%3),out=word.split('').map(ch=>String.fromCharCode(ch.charCodeAt(0)+shift)).join('');B.push(q(`${word} के प्रत्येक अक्षर में ${shift} जोड़ने पर कोड क्या होगा?`,`If each letter of ${word} is shifted by ${shift}, what is the code?`,[out,word,word.split('').reverse().join(''),out.slice(0,-1)],0,'Reasoning'))}
const facts=[
['भारत का संविधान कब लागू हुआ?','When did the Constitution of India come into force?',['26 जनवरी 1950','15 अगस्त 1947','26 नवंबर 1949','2 अक्टूबर 1950'],0],
['भारत का राष्ट्रीय पशु कौन है?','What is the national animal of India?',['बाघ','सिंह','हाथी','मोर'],0],
['भारत की राजधानी क्या है?','What is the capital of India?',['नई दिल्ली','मुंबई','कोलकाता','चेन्नई'],0],
['भारतीय संविधान की प्रस्तावना में कितने प्रमुख आदर्श बताए गए हैं?','Which ideals are prominently stated in the Preamble?',['न्याय, स्वतंत्रता, समानता और बंधुता','केवल न्याय','केवल समानता','केवल स्वतंत्रता'],0],
['सूर्य के सबसे निकट ग्रह कौन-सा है?','Which planet is closest to the Sun?',['बुध','शुक्र','पृथ्वी','मंगल'],0],
['जल का रासायनिक सूत्र क्या है?','What is the chemical formula of water?',['H₂O','CO₂','O₂','NaCl'],0],
['पृथ्वी का उपग्रह कौन है?','What is Earth’s natural satellite?',['चंद्रमा','सूर्य','मंगल','शुक्र'],0],
['भारत में हरित क्रांति का संबंध मुख्यतः किससे है?','The Green Revolution in India is mainly associated with:',['कृषि उत्पादन','दूरसंचार','परिवहन','खनन'],0],
['लोकसभा का सामान्य कार्यकाल कितना है?','What is the normal term of the Lok Sabha?',['5 वर्ष','4 वर्ष','6 वर्ष','7 वर्ष'],0],
['RBI का मुख्यालय कहाँ है?','Where is the headquarters of RBI?',['मुंबई','नई दिल्ली','पटना','कोलकाता'],0],
['बिहार की राजधानी क्या है?','What is the capital of Bihar?',['पटना','गया','भागलपुर','मुजफ्फरपुर'],0],
['बिहार दिवस कब मनाया जाता है?','When is Bihar Day observed?',['22 मार्च','15 अगस्त','26 जनवरी','2 अक्टूबर'],0],
['बोधगया किस जिले में है?','Bodh Gaya is in which district?',['गया','पटना','नालंदा','भोजपुर'],0],
['नालंदा प्राचीन विश्वविद्यालय किस राज्य में था?','Nalanda ancient university was in which state?',['बिहार','उत्तर प्रदेश','मध्य प्रदेश','राजस्थान'],0],
['भारतीय संसद के दो सदन कौन-से हैं?','What are the two Houses of the Indian Parliament?',['लोकसभा और राज्यसभा','विधानसभा और परिषद','लोकसभा और विधानसभा','राज्यसभा और परिषद'],0],
['भारतीय राष्ट्रीय ध्वज के बीच में कौन-सा चक्र है?','Which wheel is at the centre of India’s national flag?',['अशोक चक्र','धर्म चक्र','सूर्य चक्र','विजय चक्र'],0],
['वायुमंडल में सर्वाधिक गैस कौन-सी है?','Which gas is most abundant in Earth’s atmosphere?',['नाइट्रोजन','ऑक्सीजन','कार्बन डाइऑक्साइड','हाइड्रोजन'],0],
['मानव शरीर में रक्त पंप करने वाला अंग कौन-सा है?','Which organ pumps blood in the human body?',['हृदय','फेफड़ा','यकृत','गुर्दा'],0],
['बल की SI इकाई क्या है?','What is the SI unit of force?',['न्यूटन','जूल','वाट','पास्कल'],0],
['प्रकाश की गति निर्वात में लगभग कितनी है?','What is the approximate speed of light in vacuum?',['3×10⁸ m/s','3×10⁶ m/s','3×10⁴ m/s','3×10¹⁰ m/s'],0]
];facts.forEach(x=>B.push(q(x[0],x[1],x[2],x[3],exam.includes('bihar')||exam==='bpsc-cce'?'General Studies':'General Awareness')));
const eng=[['He ___ to school every day.','He ___ to school every day.',['goes','go','going','gone'],0],['Choose the antonym of “ancient”.','Choose the antonym of “ancient”.',['modern','old','early','past'],0],['Choose the synonym of “rapid”.','Choose the synonym of “rapid”.',['fast','slow','late','weak'],0],['Plural of “child” is:','Plural of “child” is:',['children','childs','childes','childrens'],0],['Choose the correct spelling.','Choose the correctly spelt word.',['necessary','neccessary','necessery','necesary'],0]];eng.forEach(x=>B.push(q(x[0],x[1],x[2],x[3],'English')));return B}
let all=bank();
// Deterministically choose 30 unique questions for each mock. IDs differ by mock so the 10 mock sets are distinct selections.
let start=((mock-1)*29+(exam.length*7))%all.length;let selected=[];let seen=new Set();for(let k=0;k<all.length&&selected.length<30;k++){let idx=(start+k*17+Math.floor(k/7)*3)%all.length;if(!seen.has(idx)){seen.add(idx);selected.push(all[idx])}}selected=selected.slice(0,30);
let answers=Array(30).fill(null),current=0,paused=false,seconds=1800,finished=false;const key=`examAttempt:${exam}:mock${mock}`;
function render(){if(finished)return;let x=selected[current],lang=document.getElementById('lang').value;document.getElementById('section').textContent=x.s;let text=lang==='hi'?x.hi:lang==='en'?x.en:`${x.en}<br><span style="font-size:18px;color:#475569">${x.hi}</span>`;document.getElementById('question').innerHTML=`<div class="qno">Question ${current+1} of 30</div><div class="q">${text}</div>${x.opts.map((o,i)=>`<label class="opt"><input type="radio" name="ans" value="${i}" ${answers[current]===i?'checked':''} onchange="answers[current]=${i};renderPalette()">${o}</label>`).join('')}`;renderPalette()}
function renderPalette(){document.getElementById('palette').innerHTML=selected.map((_,i)=>`<button class="p ${i===current?'current':''} ${answers[i]!==null?'answered':''}" onclick="current=${i};render()">${i+1}</button>`).join('')}
function nextQ(){if(current<29){current++;render()}else{submitTest()}}function prevQ(){if(current>0){current--;render()}}
function pauseTest(){if(finished)return;paused=true;document.getElementById('cover').style.display='flex';document.getElementById('pause').style.display='none';document.getElementById('resume').style.display='block'}function resumeTest(){paused=false;document.getElementById('cover').style.display='none';document.getElementById('pause').style.display='block';document.getElementById('resume').style.display='none'}
function submitTest(){if(finished)return;if(!confirm('क्या आप test submit करना चाहते हैं?'))return;finished=true;let correct=0,wrong=0,skip=0;answers.forEach((a,i)=>a===null?skip++:a===selected[i].a?correct++:wrong++);let result={exam,mock,attemptedAt:new Date().toISOString(),correct,wrong,skip,score:correct,answers};localStorage.setItem(key,JSON.stringify(result));let stats=JSON.parse(localStorage.getItem('examStats')||'{}');stats.attempted=(stats.attempted||0)+1;stats.totalScore=(stats.totalScore||0)+correct;stats.bestScore=Math.max(stats.bestScore||0,correct);localStorage.setItem('examStats',JSON.stringify(stats));let history=JSON.parse(localStorage.getItem('testHistory')||'[]');history.unshift({key,name:info[0],mock,score:correct,total:30,date:result.attemptedAt});localStorage.setItem('testHistory',JSON.stringify(history.slice(0,100)));document.getElementById('testView').style.display='none';let R=document.getElementById('result');R.style.display='block';R.innerHTML=`<div class="score">${correct} / 30</div><p><b>${info[0]} — Mock Test ${mock}</b></p><div class="stats"><div class="stat"><b>${correct} ✅</b><span>Correct</span></div><div class="stat"><b>${wrong} ❌</b><span>Wrong</span></div><div class="stat"><b>${skip} ⭕</b><span>Not Attempted</span></div></div><p><b>Percentage: ${(correct/30*100).toFixed(2)}%</b></p><div class="actions"><button class="btn" onclick="location.href='exam-mock.html?exam=${exam}&mock=${mock}'">🔁 Reattempt Test</button><a class="btn gray" href="all-exam-mocks.html">← All Mock Tests</a></div><div class="review"><h3>📋 Answer Review</h3>${selected.map((x,i)=>{let a=answers[i],cls=a===null?'skip':a===x.a?'correct':'wrong',label=a===null?'Not Attempted':a===x.a?'Correct':'Wrong';return `<div class="reviewItem ${cls}"><b>Q${i+1}. ${label}</b><div>${x.hi}</div><div class="muted">${x.en}</div><div>Your answer: ${a===null?'—':x.opts[a]}</div><div>Correct answer: <b>${x.opts[x.a]}</b></div></div>`}).join('')}</div>`}
setInterval(()=>{if(!paused&&!finished&&seconds>0){seconds--;let m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent=`${m}:${s}`;if(seconds===0)submitTest()}},1000);render();
</script></body></html>
