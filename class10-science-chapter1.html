const qs=[{"hi":"रासायनिक अभिक्रिया का प्रमुख संकेत क्या हो सकता है?","hopts":["केवल आकार बदलना","केवल स्थान बदलना","रंग परिवर्तन, गैस निकलना या तापमान परिवर्तन","केवल पिघलना"],"correct":2,"hexp":"इनमें से रंग परिवर्तन, गैस का निकलना और तापमान में परिवर्तन रासायनिक अभिक्रिया के सामान्य संकेत हैं।","en":"What can be a major sign of a chemical reaction?","eopts":["Only change in shape","Only change in position","Change in colour, evolution of gas or change in temperature","Only melting"],"eexp":"Change in colour, evolution of gas and change in temperature are common signs of a chemical reaction."},{"hi":"मैग्नीशियम रिबन को जलाने पर क्या बनता है?","hopts":["मैग्नीशियम क्लोराइड","मैग्नीशियम ऑक्साइड","मैग्नीशियम सल्फाइड","मैग्नीशियम कार्बोनेट"],"correct":1,"hexp":"2Mg + O₂ → 2MgO; मैग्नीशियम ऑक्सीजन से अभिक्रिया करके मैग्नीशियम ऑक्साइड बनाता है।","en":"What is formed when a magnesium ribbon is burnt?","eopts":["Magnesium chloride","Magnesium oxide","Magnesium sulphide","Magnesium carbonate"],"eexp":"Magnesium reacts with oxygen to form magnesium oxide: 2Mg + O₂ → 2MgO."},{"hi":"रासायनिक समीकरण को संतुलित करने का आधार क्या है?","hopts":["ऊर्जा संरक्षण का नियम","द्रव्यमान संरक्षण का नियम","न्यूटन का नियम","ओम का नियम"],"correct":1,"hexp":"रासायनिक अभिक्रिया में कुल द्रव्यमान संरक्षित रहता है, इसलिए समीकरण में दोनों ओर परमाणुओं की संख्या समान की जाती है।","en":"What is the basis for balancing a chemical equation?","eopts":["Law of conservation of energy","Law of conservation of mass","Newton's law","Ohm's law"],"eexp":"The total mass is conserved in a chemical reaction, so the number of atoms of each element must be equal on both sides."},{"hi":"2Mg + O₂ → 2MgO किस प्रकार की अभिक्रिया है?","hopts":["वियोजन अभिक्रिया","संयोजन अभिक्रिया","विस्थापन अभिक्रिया","द्विविस्थापन अभिक्रिया"],"correct":1,"hexp":"दो पदार्थ मिलकर एक उत्पाद बनाते हैं, इसलिए यह संयोजन अभिक्रिया है।","en":"What type of reaction is 2Mg + O₂ → 2MgO?","eopts":["Decomposition reaction","Combination reaction","Displacement reaction","Double displacement reaction"],"eexp":"Two substances combine to form one product, so it is a combination reaction."},{"hi":"CaO + H₂O → Ca(OH)₂ किस प्रकार की अभिक्रिया है?","hopts":["संयोजन अभिक्रिया","वियोजन अभिक्रिया","विस्थापन अभिक्रिया","अपघटन अभिक्रिया"],"correct":0,"hexp":"कैल्शियम ऑक्साइड और जल मिलकर एक उत्पाद कैल्शियम हाइड्रॉक्साइड बनाते हैं।","en":"What type of reaction is CaO + H₂O → Ca(OH)₂?","eopts":["Combination reaction","Decomposition reaction","Displacement reaction","Double displacement reaction"],"eexp":"Calcium oxide and water combine to form one product, calcium hydroxide."},{"hi":"CaCO₃ → CaO + CO₂ किस प्रकार की अभिक्रिया है?","hopts":["संयोजन अभिक्रिया","वियोजन अभिक्रिया","उदासीनीकरण","विस्थापन"],"correct":1,"hexp":"एक यौगिक टूटकर दो उत्पाद बनाता है, इसलिए यह वियोजन अभिक्रिया है।","en":"What type of reaction is CaCO₃ → CaO + CO₂?","eopts":["Combination reaction","Decomposition reaction","Neutralisation","Displacement"],"eexp":"One compound breaks down into two products, so it is a decomposition reaction."},{"hi":"2AgCl → 2Ag + Cl₂ किसकी उपस्थिति में होता है?","hopts":["अंधकार","सूर्य के प्रकाश","केवल जल","केवल नाइट्रोजन"],"correct":1,"hexp":"सिल्वर क्लोराइड प्रकाश के प्रभाव से विघटित होकर सिल्वर और क्लोरीन बनाता है।","en":"2AgCl → 2Ag + Cl₂ occurs in the presence of what?","eopts":["Darkness","Sunlight","Only water","Only nitrogen"],"eexp":"Silver chloride decomposes in the presence of light to form silver and chlorine."},{"hi":"Fe + CuSO₄ → FeSO₄ + Cu किस प्रकार की अभिक्रिया है?","hopts":["संयोजन","विस्थापन","वियोजन","दहन"],"correct":1,"hexp":"लोहा कॉपर से अधिक क्रियाशील होने के कारण कॉपर को उसके लवण से विस्थापित करता है।","en":"What type of reaction is Fe + CuSO₄ → FeSO₄ + Cu?","eopts":["Combination","Displacement","Decomposition","Combustion"],"eexp":"Iron is more reactive than copper and displaces copper from its salt."},{"hi":"AgNO₃ + NaCl → AgCl + NaNO₃ किस प्रकार की अभिक्रिया है?","hopts":["संयोजन","द्विविस्थापन","वियोजन","दहन"],"correct":1,"hexp":"दो यौगिक अपने आयनों का आदान-प्रदान करते हैं।","en":"What type of reaction is AgNO₃ + NaCl → AgCl + NaNO₃?","eopts":["Combination","Double displacement","Decomposition","Combustion"],"eexp":"The two compounds exchange their ions, so it is a double displacement reaction."},{"hi":"ऑक्सीकरण में सामान्यतः क्या होता है?","hopts":["ऑक्सीजन का जुड़ना या हाइड्रोजन का हटना","केवल रंग बदलना","केवल जल बनना","केवल ताप घटाना"],"correct":0,"hexp":"ऑक्सीकरण को ऑक्सीजन के जुड़ने या हाइड्रोजन के हटने के रूप में समझा जाता है।","en":"What generally happens in oxidation?","eopts":["Addition of oxygen or removal of hydrogen","Only colour change","Only formation of water","Only decrease in temperature"],"eexp":"Oxidation can be understood as addition of oxygen or removal of hydrogen."},{"hi":"अपचयन में सामान्यतः क्या होता है?","hopts":["ऑक्सीजन का जुड़ना","ऑक्सीजन का हटना या हाइड्रोजन का जुड़ना","केवल गैस बनना","केवल रंग बदलना"],"correct":1,"hexp":"अपचयन में ऑक्सीजन हट सकती है या हाइड्रोजन जुड़ सकता है।","en":"What generally happens in reduction?","eopts":["Addition of oxygen","Removal of oxygen or addition of hydrogen","Only formation of gas","Only colour change"],"eexp":"Reduction involves removal of oxygen or addition of hydrogen."},{"hi":"ऑक्सीकरण और अपचयन साथ-साथ होने वाली अभिक्रिया कहलाती है?","hopts":["उदासीनीकरण","रेडॉक्स अभिक्रिया","वियोजन","संयोजन"],"correct":1,"hexp":"रेडॉक्स में oxidation और reduction दोनों एक साथ होते हैं।","en":"A reaction in which oxidation and reduction occur together is called what?","eopts":["Neutralisation reaction","Redox reaction","Decomposition reaction","Combination reaction"],"eexp":"A redox reaction involves oxidation and reduction at the same time."},{"hi":"CuO + H₂ → Cu + H₂O में CuO का क्या होता है?","hopts":["ऑक्सीकरण","अपचयन","दहन","वियोजन"],"correct":1,"hexp":"CuO से ऑक्सीजन हटकर Cu बनता है, इसलिए CuO का अपचयन होता है।","en":"In CuO + H₂ → Cu + H₂O, what happens to CuO?","eopts":["Oxidation","Reduction","Combustion","Decomposition"],"eexp":"Oxygen is removed from CuO to form Cu, so CuO is reduced."},{"hi":"CuO + H₂ → Cu + H₂O में H₂ का क्या होता है?","hopts":["अपचयन","ऑक्सीकरण","वियोजन","कोई परिवर्तन नहीं"],"correct":1,"hexp":"हाइड्रोजन ऑक्सीजन ग्रहण करके जल बनाता है, इसलिए इसका ऑक्सीकरण होता है।","en":"In CuO + H₂ → Cu + H₂O, what happens to H₂?","eopts":["Reduction","Oxidation","Decomposition","No change"],"eexp":"Hydrogen gains oxygen to form water, so hydrogen is oxidised."},{"hi":"तेल और वसा के खराब होने की प्रक्रिया को क्या कहते हैं?","hopts":["उदासीनीकरण","विकृतगंधिता","विस्थापन","वाष्पीकरण"],"correct":1,"hexp":"तेल और वसा के ऑक्सीकरण से दुर्गंध और खराब स्वाद पैदा होता है, इसे rancidity कहते हैं।","en":"What is the process of spoilage of oils and fats called?","eopts":["Neutralisation","Rancidity","Displacement","Evaporation"],"eexp":"Oxidation of oils and fats produces unpleasant smell and taste; this is called rancidity."},{"hi":"विकृतगंधिता को कम करने के लिए क्या किया जा सकता है?","hopts":["एंटीऑक्सीडेंट मिलाना","पानी मिलाना","नमक हटाना","तापमान बढ़ाना"],"correct":0,"hexp":"एंटीऑक्सीडेंट ऑक्सीकरण को धीमा करके खाद्य पदार्थों को लंबे समय तक सुरक्षित रखने में मदद करते हैं।","en":"What can be done to reduce rancidity?","eopts":["Adding antioxidants","Adding water","Removing salt","Increasing temperature"],"eexp":"Antioxidants slow down oxidation and help protect food."},{"hi":"चिप्स के पैकेट में नाइट्रोजन गैस भरने का उद्देश्य क्या है?","hopts":["पैकेट भारी करना","ऑक्सीकरण को रोकना या धीमा करना","स्वाद हटाना","जल बढ़ाना"],"correct":1,"hexp":"नाइट्रोजन अपेक्षाकृत निष्क्रिय होती है और ऑक्सीजन की जगह लेकर वसा के ऑक्सीकरण को कम करती है।","en":"Why is nitrogen gas filled in packets of chips?","eopts":["To make the packet heavy","To prevent or slow oxidation","To remove flavour","To add water"],"eexp":"Nitrogen is relatively unreactive and reduces oxidation of fats by replacing oxygen."},{"hi":"श्वसन किस प्रकार की अभिक्रिया है?","hopts":["उष्माशोषी","उष्माक्षेपी","वियोजन ही","द्विविस्थापन"],"correct":1,"hexp":"श्वसन में ग्लूकोज का ऑक्सीकरण होता है और ऊर्जा निकलती है।","en":"Respiration is what type of reaction?","eopts":["Endothermic reaction","Exothermic reaction","Only decomposition","Double displacement"],"eexp":"Respiration involves oxidation of glucose and releases energy."},{"hi":"उष्माक्षेपी अभिक्रिया में क्या होता है?","hopts":["ऊष्मा अवशोषित होती है","ऊष्मा निकलती है","केवल प्रकाश निकलता है","कोई ऊर्जा परिवर्तन नहीं"],"correct":1,"hexp":"उष्माक्षेपी अभिक्रियाओं में ऊर्जा का कुछ भाग ऊष्मा के रूप में बाहर निकलता है।","en":"What happens in an exothermic reaction?","eopts":["Heat is absorbed","Heat is released","Only light is released","No energy change"],"eexp":"In an exothermic reaction, energy is released partly as heat."},{"hi":"उष्माशोषी अभिक्रिया में क्या होता है?","hopts":["ऊष्मा निकलती है","ऊष्मा अवशोषित होती है","केवल गैस निकलती है","केवल प्रकाश निकलता है"],"correct":1,"hexp":"उष्माशोषी अभिक्रिया को आगे बढ़ने के लिए आसपास से ऊष्मा अवशोषित करनी पड़ सकती है।","en":"What happens in an endothermic reaction?","eopts":["Heat is released","Heat is absorbed","Only gas is released","Only light is released"],"eexp":"An endothermic reaction absorbs heat from its surroundings."},{"hi":"चूने का पानी किसका विलयन है?","hopts":["सोडियम क्लोराइड","कैल्शियम हाइड्रॉक्साइड","हाइड्रोक्लोरिक अम्ल","कॉपर सल्फेट"],"correct":1,"hexp":"Ca(OH)₂ का जलीय विलयन lime water कहलाता है।","en":"Lime water is a solution of what?","eopts":["Sodium chloride","Calcium hydroxide","Hydrochloric acid","Copper sulphate"],"eexp":"An aqueous solution of Ca(OH)₂ is called lime water."},{"hi":"CO₂ को चूने के पानी में प्रवाहित करने पर क्या बनता है?","hopts":["कैल्शियम ऑक्साइड","कैल्शियम कार्बोनेट","सोडियम कार्बोनेट","कॉपर कार्बोनेट"],"correct":1,"hexp":"CO₂ + Ca(OH)₂ → CaCO₃ + H₂O; CaCO₃ के कारण चूने का पानी दूधिया होता है।","en":"What is formed when CO₂ is passed through lime water?","eopts":["Calcium oxide","Calcium carbonate","Sodium carbonate","Copper carbonate"],"eexp":"CO₂ + Ca(OH)₂ → CaCO₃ + H₂O; calcium carbonate makes lime water milky."},{"hi":"रासायनिक समीकरण में (s) किस अवस्था को दर्शाता है?","hopts":["ठोस","द्रव","गैस","जलीय"],"correct":0,"hexp":"(s) solid अर्थात ठोस अवस्था को दर्शाता है।","en":"What state does (s) represent in a chemical equation?","eopts":["Solid","Liquid","Gas","Aqueous"],"eexp":"(s) represents the solid state."},{"hi":"रासायनिक समीकरण में (aq) किस अवस्था को दर्शाता है?","hopts":["ठोस","द्रव","गैस","जलीय विलयन"],"correct":3,"hexp":"(aq) aqueous अर्थात जल में घुले हुए पदार्थ को दर्शाता है।","en":"What state does (aq) represent in a chemical equation?","eopts":["Solid","Liquid","Gas","Aqueous solution"],"eexp":"(aq) means aqueous, i.e. dissolved in water."},{"hi":"रासायनिक समीकरण में Δ का अर्थ क्या है?","hopts":["प्रकाश हटाना","ऊष्मा देना","जल मिलाना","गैस हटाना"],"correct":1,"hexp":"Δ का प्रयोग अभिक्रिया के लिए ऊष्मा देने का संकेत है।","en":"What does Δ mean in a chemical equation?","eopts":["Remove light","Supply heat","Add water","Remove gas"],"eexp":"Δ indicates that heat is supplied to the reaction."},{"hi":"लोहे पर जंग लगने के लिए मुख्यतः क्या आवश्यक है?","hopts":["केवल नाइट्रोजन","ऑक्सीजन और नमी","केवल कार्बन डाइऑक्साइड","केवल धूप"],"correct":1,"hexp":"लोहे की rusting के लिए ऑक्सीजन और पानी/नमी दोनों महत्वपूर्ण हैं।","en":"What is mainly required for rusting of iron?","eopts":["Only nitrogen","Oxygen and moisture","Only carbon dioxide","Only sunlight"],"eexp":"Oxygen and moisture are both important for rusting of iron."},{"hi":"जंग का सामान्य रासायनिक स्वरूप क्या है?","hopts":["कॉपर ऑक्साइड","जलयोजित आयरन(III) ऑक्साइड","सोडियम ऑक्साइड","कैल्शियम क्लोराइड"],"correct":1,"hexp":"Rust मुख्यतः hydrated iron(III) oxide का मिश्रण माना जाता है।","en":"What is the general chemical nature of rust?","eopts":["Copper oxide","Hydrated iron(III) oxide","Sodium oxide","Calcium chloride"],"eexp":"Rust is mainly hydrated iron(III) oxide."},{"hi":"लोहे को जंग से बचाने का एक तरीका क्या है?","hopts":["पें let i=0,answers=Array(qs.length).fill(null),left=1800,timer,lang='hi';
function setLang(l){lang=l;document.getElementById('hiBtn').classList.toggle('active',l==='hi');document.getElementById('enBtn').classList.toggle('active',l==='en');document.getElementById('introTitle').textContent=l==='hi'?'रासायनिक अभिक्रियाएँ एवं समीकरण':'Chemical Reactions and Equations';document.getElementById('introText').textContent=l==='hi'?'भाषा ऊपर से चुनें। पूरे test के प्रश्न और विकल्प चुनी हुई भाषा में दिखाई देंगे।':'Choose a language above. All questions and options will appear in the selected language.';document.getElementById('startBtn').textContent=l==='hi'?'Test शुरू करें':'Start Test';if(document.getElementById('test').style.display!=='none')render()}
function start(){document.querySelector('.intro').style.display='none';document.getElementById('test').style.display='block';render();timer=setInterval(()=>{left--;document.getElementById('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000)}
function render(){let x=qs[i],question=lang==='hi'?x.hi:x.en,opts=lang==='hi'?x.hopts:x.eopts;document.getElementById('q').innerHTML='<div class="question"><b>'+(lang==='hi'?'प्रश्न ':'Question ')+(i+1)+' '+(lang==='hi'?'में से ':'of ')+qs.length+'</b><br>'+question+'</div>'+opts.map((o,n)=>'<label class="opt"><input type="radio" name="o" '+(answers[i]===n?'checked':'')+' onchange="choose('+n+')"> '+String.fromCharCode(65+n)+'. '+o+'</label>').join('');document.getElementById('pal').innerHTML=qs.map((_,n)=>'<button class="p '+(n===i?'current ':'')+(answers[n]!==null?'answered':'')+'" onclick="i='+n+';render()">'+(n+1)+'</button>').join('');document.getElementById('paletteTitle').textContent=lang==='hi'?'प्रश्न सूची':'Question Palette';document.getElementById('prevBtn').textContent=lang==='hi'?'← पिछला':'← Previous';document.getElementById('nextBtn').textContent=lang==='hi'?'सहेजें और अगला →':'Save & Next →';document.getElementById('submitBtn').textContent=lang==='hi'?'Test जमा करें':'Submit Test'}
function choose(n){answers[i]=n;render()}function next(){if(i<qs.length-1){i++;render()}else finish()}function prev(){if(i>0){i--;render()}}
function finish(){clearInterval(timer);let score=answers.reduce((s,a,n)=>s+(a===qs[n].correct?1:0),0);document.getElementById('test').style.display='none';let r=document.getElementById('result');r.style.display='block';let attempted=answers.filter(x=>x!==null).length;r.innerHTML='<div class="score">'+score+'/50</div><h2>'+(lang==='hi'?'🎉 Test पूरा हुआ':'🎉 Test Completed')+'</h2><p>'+(lang==='hi'?'प्रयास किए':'Attempted')+': <b>'+attempted+'</b> / 50</p><h3>'+(lang==='hi'?'उत्तर समीक्षा':'Answer Review')+'</h3>'+qs.map((x,n)=>{let opts=lang==='hi'?x.hopts:x.eopts;let exp=lang==='hi'?x.hexp:x.eexp;return '<div class="explain"><b>Q'+(n+1)+'. '+(lang==='hi'?x.hi:x.en)+'</b><br>'+(lang==='hi'?'आपका उत्तर: ':'Your answer: ')+(answers[n]===null?(lang==='hi'?'प्रयास नहीं किया':'Not Attempted'):opts[answers[n]])+'<br><b>'+(lang==='hi'?'सही उत्तर: ':'Correct answer: ')+opts[x.correct]+'</b><br>'+exp+'</div>'}).join('')}
</script><script src="stats.js"></script></body></html>
