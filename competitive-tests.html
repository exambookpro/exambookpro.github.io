<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExamBook Pro — Competitive Exam Tests</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#312e81,#2563eb);color:#fff;padding:12px 18px}.bar{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-weight:800;font-size:20px}.timer{background:#fff;color:#111827;border-radius:8px;padding:9px 14px;font-weight:900}.pause,.resume{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.pause{background:#f59e0b}.resume{background:#16a34a;color:#fff;display:none}.select{padding:9px;border:1px solid #cbd5e1;border-radius:8px}.layout{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:1fr 300px;gap:16px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;box-shadow:0 4px 18px #0000000a}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.tab{border:1px solid #2563eb;background:#fff;color:#1d4ed8;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer}.tab.active{background:#2563eb;color:#fff}.section{background:#eef2ff;color:#3730a3;padding:10px;border-radius:8px;font-weight:800;margin:12px 0}.q{font-size:20px;line-height:1.6;margin:12px 0}.opt{display:block;border:1px solid #dbe3ef;padding:12px;margin:9px 0;border-radius:9px;cursor:pointer}.opt:hover{background:#f8fafc}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.btn{border:0;border-radius:8px;padding:11px 16px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.gray{background:#64748b}.red{background:#dc2626;width:100%;margin-top:15px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.p{height:34px;border:1px solid #94a3b8;background:#fff;border-radius:6px;cursor:pointer}.p.current{background:#2563eb;color:#fff}.p.answered{background:#16a34a;color:#fff}.cover{position:fixed;inset:0;background:#0f172acc;z-index:50;display:none;align-items:center;justify-content:center}.coverbox{background:#fff;border-radius:16px;padding:30px;text-align:center}.result{text-align:center;display:none}.score{font-size:42px;font-weight:900;color:#2563eb}.muted{color:#64748b;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}.q{font-size:18px}}
</style></head><body>
<header class="top"><div class="bar"><div class="title" id="title">📚 Competitive Full Test</div><div style="display:flex;gap:8px;align-items:center"><button id="pause" class="pause" onclick="pauseTest()">⏸ Pause</button><button id="resume" class="resume" onclick="resumeTest()">▶ Resume</button><div class="timer">⏱️ <span id="timer">60:00</span></div></div></div></header>
<main class="layout" id="layout"><section class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><b id="meta"></b><div class="muted">English + Hindi • Objective MCQ • Question bank से बिना repeat के selection</div></div><select id="lang" class="select" onchange="render()"><option value="both">English + Hindi</option><option value="hi">Hindi</option><option value="en">English</option></select></div><div id="tabs" class="tabs"></div><div id="question"></div><div class="actions"><button class="btn gray" onclick="prevQ()">← Previous</button><button class="btn" onclick="nextQ()">Save & Next →</button></div></section><aside class="card side"><h3>📋 Question Palette</h3><div class="muted">🟢 Answered &nbsp; 🔵 Current &nbsp; ⚪ Not Answered</div><div id="palette"></div><button class="btn red" onclick="submitTest()">Submit Test</button></aside></main><section id="result" class="card result"></section>
<div id="cover" class="cover"><div class="coverbox"><h2>⏸ Test Paused</h2><p>Timer रुक गया है। Resume दबाकर टेस्ट जारी करें।</p></div></div>
<script>
const params=new URLSearchParams(location.search);let exam=(params.get('exam')||'ssc').toLowerCase();
const cfg={
 ssc:{name:'SSC CGL / CHSL Practice',n:100,mins:60,marks:200,neg:.5,sections:['Reasoning','Quantitative Aptitude','General Awareness','English'],seed:'ssc'},
 railway:{name:'Railway CBT Practice',n:100,mins:90,marks:100,neg:1/3,sections:['Mathematics','Reasoning','General Science','General Awareness'],seed:'railway'},
 bihar:{name:'Bihar Competitive Practice',n:150,mins:150,marks:150,neg:0,sections:['Bihar GK','General Studies','Mathematics','Hindi','Reasoning'],seed:'bihar'}
};
const C=cfg[exam]||cfg.ssc;document.getElementById('title').textContent='📚 '+C.name+' — Full Test';document.getElementById('meta').textContent=`${C.n} Questions • ${C.marks} Marks • ${C.mins} Minutes${C.neg?' • Negative Marking: '+C.neg:' • No Negative Marking'}`;document.title='ExamBook Pro — '+C.name;
const Q=[];function add(id,sec,hi,en,opts,ans){Q.push({id,sec,hi,en,opts,a:ans});}
function sh(a){return [...a].sort(()=>Math.random()-.5)}
function buildSSC(){
 for(let i=1;i<=30;i++){let a=10+i,b=5+(i%9);add('S-M'+i,'Quantitative Aptitude',`${a}+${b} = ?`,`What is ${a}+${b}?`,[String(a+b),String(a+b+1),String(a+b-1),String(a+b+2)],0);}
 for(let i=1;i<=25;i++){let a=20+i,b=2+(i%6);add('S-P'+i,'Reasoning',`श्रृंखला में ${a}, ${a+b}, ${a+2*b}, ? के बाद संख्या क्या होगी?`,`In the series ${a}, ${a+b}, ${a+2*b}, what comes next?`,[String(a+3*b),String(a+2*b+1),String(a+4*b),String(a+b)],0);}
 const g=[['भारतीय संविधान का संरक्षक किसे कहा जाता है?','Who is regarded as the guardian of the Constitution of India?',['Supreme Court','Parliament','President','Election Commission'],0],['भारत का राष्ट्रीय जलीय जीव कौन है?','What is the national aquatic animal of India?',['Ganges river dolphin','Blue whale','Crocodile','Turtle'],0],['हरित क्रांति का संबंध मुख्यतः किससे है?','The Green Revolution is mainly associated with:',['Agriculture','Industry','Banking','Transport'],0],['भारतीय रिजर्व बैंक की स्थापना किस वर्ष हुई?','In which year was the Reserve Bank of India established?',['1935','1947','1950','1969'],0],['विटामिन C की कमी से कौन-सा रोग होता है?','Deficiency of vitamin C causes:',['Scurvy','Rickets','Beriberi','Night blindness'],0]];
 for(let r=0;r<5;r++)g.forEach((x,j)=>add('S-G'+(r*5+j),'General Awareness',x[0],x[1],x[2],x[3]));
 const e=[['Choose the synonym of “rapid”.','“Rapid” का समानार्थी चुनिए।',['Fast','Slow','Late','Weak'],0],['Choose the antonym of “ancient”.','“Ancient” का विलोम चुनिए।',['Modern','Old','Past','Historic'],0],['Fill in: She ___ to school every day.','रिक्त स्थान भरें: She ___ to school every day.',['goes','go','going','gone'],0],['Choose the correctly spelt word.','सही वर्तनी वाला शब्द चुनिए।',['Necessary','Neccessary','Necesary','Necassary'],0],['A person who writes poems is a ___.','कविता लिखने वाला व्यक्ति ___.',['Poet','Painter','Pilot','Sculptor'],0]];
 for(let r=0;r<4;r++)e.forEach((x,j)=>add('S-E'+(r*5+j),'English',x[0],x[1],x[2],x[3]));
}
function buildRail(){
 for(let i=1;i<=30;i++){let a=12+i,b=3+(i%8);add('R-M'+i,'Mathematics',`${a} × ${b} = ?`,`What is ${a} × ${b}?`,[String(a*b),String(a*b+1),String(a*b-b),String(a+b)],0);}
 for(let i=1;i<=25;i++){let a=3+i;add('R-R'+i,'Reasoning',`यदि A=1, B=2 ... तो ${String.fromCharCode(64+a)} का मान क्या है?`,`If A=1, B=2 ... what is the value of ${String.fromCharCode(64+a)}?`,[String(a),String(a+1),String(a-1),String(26-a)],0);}
 const s=[['पानी का रासायनिक सूत्र क्या है?','What is the chemical formula of water?',['H₂O','CO₂','O₂','NaCl'],0],['मानव शरीर में रक्त पंप करने वाला अंग कौन-सा है?','Which organ pumps blood in the human body?',['Heart','Lung','Kidney','Liver'],0],['बल की SI इकाई क्या है?','What is the SI unit of force?',['Newton','Joule','Watt','Pascal'],0],['प्रकाश संश्लेषण में पौधे किस गैस का उपयोग करते हैं?','Which gas do plants use in photosynthesis?',['Carbon dioxide','Oxygen','Nitrogen','Hydrogen'],0],['ध्वनि किस माध्यम में सबसे तेज चलती है?','Sound travels fastest through:',['Solids','Liquids','Gases','Vacuum'],0]];
 for(let r=0;r<5;r++)s.forEach((x,j)=>add('R-S'+(r*5+j),'General Science',x[0],x[1],x[2],x[3]));
 const g=[['भारत का राष्ट्रीय पशु कौन है?','What is the national animal of India?',['Tiger','Lion','Elephant','Leopard'],0],['भारत की राजधानी क्या है?','What is the capital of India?',['New Delhi','Mumbai','Kolkata','Chennai'],0],['भारतीय रेल का मुख्यालय कहाँ है?','Where is the headquarters of Indian Railways?',['New Delhi','Mumbai','Kolkata','Lucknow'],0],['गंगा नदी का उद्गम किस हिमनद से माना जाता है?','The Ganga is traditionally considered to originate from which glacier?',['Gangotri','Siachen','Yamunotri','Zemu'],0],['भारत में गणतंत्र दिवस कब मनाया जाता है?','When is Republic Day celebrated in India?',['26 January','15 August','2 October','14 November'],0]];
 for(let r=0;r<4;r++)g.forEach((x,j)=>add('R-G'+(r*5+j),'General Awareness',x[0],x[1],x[2],x[3]));
}
function buildBihar(){
 const bg=[['बिहार की राजधानी क्या है?','What is the capital of Bihar?',['Patna','Gaya','Muzaffarpur','Bhagalpur'],0],['बिहार दिवस कब मनाया जाता है?','When is Bihar Diwas observed?',['22 March','15 August','26 January','2 October'],0],['बोधगया किस जिले में है?','Bodh Gaya is in which district?',['Gaya','Patna','Nalanda','Vaishali'],0],['नालंदा प्राचीन रूप से किसके लिए प्रसिद्ध था?','Nalanda was historically famous for its:',['University','Port','Fort','Textile market'],0],['छठ पर्व में मुख्यतः किस देवता की उपासना की जाती है?','Chhath festival mainly worships the:',['Sun','Moon','Fire','Rain god'],0],['वाल्मीकि राष्ट्रीय उद्यान किस राज्य में है?','Valmiki National Park is in which state?',['Bihar','Jharkhand','Uttar Pradesh','West Bengal'],0],['राजगीर किस राज्य में स्थित है?','Rajgir is located in which state?',['Bihar','Odisha','Madhya Pradesh','Rajasthan'],0],['वैशाली किस प्राचीन गणराज्य से जुड़ा है?','Vaishali is associated with which ancient republic?',['Vajji','Magadha','Kuru','Avanti'],0],['बिहार का प्रमुख लोकनृत्य कौन-सा है?','Which is a well-known folk dance tradition of Bihar?',['Jat-Jatin','Garba','Bihu','Ghoomar'],0],['सोन नदी किसकी सहायक नदी है?','Son is a tributary of which river?',['Ganga','Yamuna','Godavari','Narmada'],0]];
 for(let r=0;r<6;r++)bg.forEach((x,j)=>add('B-B'+(r*10+j),'Bihar GK',x[0],x[1],x[2],x[3]));
 const gs=[['भारतीय संविधान कब लागू हुआ?','When did the Constitution of India come into force?',['26 January 1950','15 August 1947','26 November 1949','2 October 1950'],0],['मौलिक अधिकार संविधान के किस भाग में हैं?','Fundamental Rights are in which Part of the Constitution?',['Part III','Part II','Part IV','Part V'],0],['पृथ्वी का प्राकृतिक उपग्रह कौन है?','What is Earth’s natural satellite?',['Moon','Mars','Sun','Venus'],0],['जल का क्वथनांक सामान्य दाब पर कितना है?','At normal pressure, water boils at:',['100°C','0°C','50°C','212°C below zero'],0],['लोकसभा का सामान्य कार्यकाल कितना है?','The normal term of the Lok Sabha is:',['5 years','4 years','6 years','7 years'],0]];
 for(let r=0;r<6;r++)gs.forEach((x,j)=>add('B-G'+(r*5+j),'General Studies',x[0],x[1],x[2],x[3]));
 for(let i=1;i<=30;i++){let a=15+i,b=2+(i%7);add('B-M'+i,'Mathematics',`${a} + ${b} × 2 = ?`,`What is ${a} + ${b} × 2?`,[String(a+b*2),String((a+b)*2),String(a+b),String(a+b*2+1)],0);}
 const h=[['“आकाश” का पर्यायवाची क्या है?','What is a synonym of “आकाश”?',['गगन','पाताल','धरती','सागर'],0],['“अंधकार” का विलोम क्या है?','What is the antonym of “अंधकार”?',['प्रकाश','रात्रि','छाया','तम'],0],['“राम ने फल खाया” में कर्ता कौन है?','In “Ram ate the fruit”, who is the subject?',['राम','फल','खाया','ने'],0],['संज्ञा किसे कहते हैं?','What is a noun?',['नाम बताने वाले शब्द','काम बताने वाले शब्द','गुण बताने वाले शब्द','संबंध बताने वाले शब्द'],0],['“सुंदर” किस प्रकार का शब्द है?','“सुंदर” is what type of word?',['विशेषण','संज्ञा','क्रिया','सर्वनाम'],0]];
 for(let r=0;r<4;r++)h.forEach((x,j)=>add('B-H'+(r*5+j),'Hindi',x[0],x[1],x[2],x[3]));
 for(let i=1;i<=20;i++){let a=4+i;add('B-R'+i,'Reasoning',`यदि ${a} के बाद प्रत्येक संख्या में 3 जोड़ा जाए, अगली संख्या क्या होगी?`,`If 3 is added after ${a} in the sequence, what is the next number?`,[String(a+3),String(a+2),String(a+4),String(a+6)],0);}
}
if(exam==='ssc')buildSSC();else if(exam==='railway')buildRail();else buildBihar();
// Add deterministic variants so the bank is much larger while keeping every generated question ID unique.
const base=Q.slice();for(let v=1;v<=3;v++)base.forEach(x=>{if(x.sec==='Quantitative Aptitude'){let m=v*7;add(x.id+'v'+v,x.sec,x.hi.replace(/\d+/g,n=>+n+m),x.en.replace(/\d+/g,n=>+n+m),x.opts.map((o,i)=>String(+o+(i===0?m*2:m))),x.a)}else if(x.sec==='Mathematics'){add(x.id+'v'+v,x.sec,x.hi.replace(/\d+/g,n=>+n+v),x.en.replace(/\d+/g,n=>+n+v),x.opts.map((o,i)=>String(+o+(i===0?v*2:v))),x.a)}else if(x.sec==='Reasoning'){add(x.id+'v'+v,x.sec,x.hi.replace(/\d+/g,n=>+n+v),x.en.replace(/\d+/g,n=>+n+v),x.opts.map((o,i)=>String(+o+(i===0?v:v-1))),x.a)}});
let used=JSON.parse(localStorage.getItem('exambook_used_'+C.seed)||'[]');let available=Q.filter(x=>!used.includes(x.id));if(available.length<C.n){used=[];available=Q.slice();}
let selected=sh(available).slice(0,C.n);used.push(...selected.map(x=>x.id));localStorage.setItem('exambook_used_'+C.seed,JSON.stringify(used));
let answers=Array(C.n).fill(null),idx=0,remaining=C.mins*60,running=true,interval=setInterval(()=>{if(running){remaining--;if(remaining<=0){remaining=0;clearInterval(interval);submitTest();}clock();}},1000);
function clock(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function section(){return selected[idx].sec}function renderTabs(){document.getElementById('tabs').innerHTML=C.sections.map(s=>`<button class="tab ${s===section()?'active':''}" onclick="goSection('${s.replace(/'/g,"\\'")}')">${s}</button>`).join('')}
function render(){let x=selected[idx],lang=document.getElementById('lang').value;let q=lang==='hi'?x.hi:lang==='en'?x.en:x.en+'<br><span style="font-size:17px">'+x.hi+'</span>';document.getElementById('question').innerHTML=`<div class="section">${x.sec}</div><div class="muted">Question ${idx+1} of ${C.n}</div><div class="q">${q}</div>`+x.opts.map((o,i)=>`<label class="opt"><input type="radio" name="ans" ${answers[idx]===i?'checked':''} onchange="answers[${idx}]=${i};renderPalette()"> ${o}</label>`).join('');renderTabs();renderPalette();clock()}
function renderPalette(){document.getElementById('palette').innerHTML=selected.map((x,i)=>`<button class="p ${i===idx?'current':''} ${answers[i]!==null?'answered':''}" onclick="idx=${i};render()">${i+1}</button>`).join('')}
function nextQ(){if(idx<C.n-1){idx++;render()}else alert('यह अंतिम प्रश्न है। Submit Test दबाएँ।')}function prevQ(){if(idx>0){idx--;render()}}
function goSection(s){let n=selected.findIndex((x,i)=>x.sec===s&&i!==idx);if(n>=0){idx=n;render()}}
function pauseTest(){if(!running)return;running=false;document.getElementById('cover').style.display='flex';document.getElementById('pause').style.display='none';document.getElementById('resume').style.display='inline-block'}
function resumeTest(){if(running)return;running=true;document.getElementById('cover').style.display='none';document.getElementById('pause').style.display='inline-block';document.getElementById('resume').style.display='none'}
function submitTest(){if(!confirm('क्या आप टेस्ट submit करना चाहते हैं?'))return;clearInterval(interval);let correct=0,attempt=0;answers.forEach((a,i)=>{if(a!==null){attempt++;if(a===selected[i].a)correct++;}});let wrong=attempt-correct;let score=correct-(wrong*C.neg);document.getElementById('layout').style.display='none';let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>🎉 Test Completed</h2><div class="score">${score.toFixed(2)} / ${C.marks}</div><p>सही: ${correct} &nbsp; | &nbsp; गलत: ${wrong} &nbsp; | &nbsp; छोड़े: ${C.n-attempt}</p><p class="muted">अगले attempt में पहले इस्तेमाल किए गए questions दोबारा नहीं आएँगे, जब तक question bank समाप्त नहीं होता।</p><button class="btn" onclick="location.reload()">New Test</button>`}
render();
</script></body></html>
