<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamBook Pro — Verified Cloud Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="verified-results.js?v=20260922"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{position:sticky;top:0;z-index:10;background:#172554;color:#fff;padding:12px 16px}.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:900}.right{display:flex;gap:7px;align-items:center}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}.lang{background:#fff;color:#172033}.lang.active{background:#2563eb;color:#fff}.timer{background:#fff;color:#111827;border-radius:8px;padding:9px 12px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:18px}.panel,.intro{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;box-shadow:0 3px 14px #0000000a}.intro{background:linear-gradient(110deg,#eef2ff,#dbeafe);margin-bottom:15px}.select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:10px 0}.q{font-size:20px;line-height:1.55;margin:15px 0}.opt{display:block;border:1px solid #dbe3ef;border-radius:9px;padding:13px;margin:9px 0;cursor:pointer}.opt.sel{background:#eff6ff;border-color:#2563eb}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.primary{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff;width:100%;margin-top:15px}.submitbar{position:sticky;bottom:0;z-index:15;background:#fff;border-top:1px solid #dbe3ef;padding:10px 0 2px;margin-top:10px}.red:disabled{opacity:.65;cursor:not-allowed}.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}.p{width:36px;height:34px;border:1px solid #94a3b8;background:#fff;border-radius:6px}.p.ans{background:#16a34a;color:#fff}.result{display:none}.score{font-size:42px;font-weight:900;color:#2563eb}.explain{background:#eff6ff;border-left:4px solid #2563eb;padding:12px;margin-top:12px}.hidden{display:none}@media(max-width:650px){.wrap{padding:12px}.q{font-size:18px}.actions{flex-direction:column}.right{width:100%;justify-content:flex-end}}</style>
</head><body><header class="top"><div class="bar"><div class="brand">☁️ ExamBook Pro — Verified Test</div><div class="right"><button id="hi" class="btn lang active" onclick="setLang('hi')">हिंदी</button><button id="en" class="btn lang" onclick="setLang('en')">English</button><span class="timer">⏱ <span id="clock">--:--</span></span></div></div></header>
<main class="wrap"><section id="chooser" class="intro"><h1>Verified Cloud Test</h1><p>इस page पर Admin द्वारा बनाए गए database tests चलेंगे। Score server पर questions के correct answers से calculate होगा।</p><select id="tests" class="select"><option value="">Loading tests...</option></select><button class="btn primary" onclick="start()">Start Test</button></section>
<section id="test" class="panel hidden"><h2 id="title"></h2><div id="sectionInfo" style="font-weight:800;color:#2563eb;margin:6px 0"></div><div id="q"></div><div class="actions"><button class="btn" onclick="prev()">← Previous</button><button class="btn primary" onclick="next()">Save & Next →</button></div><div id="pal" class="palette"></div><div class="submitbar"><button id="submitBtn" class="btn red" onclick="submitTest()">Submit Test</button></div></section>
<section id="result" class="panel result"></section></main>
<script>
const SUPABASE_URL="https://abgigsjhdvsqehgdhbym.supabase.co",SUPABASE_KEY="sb_publishable_GGcJmjwLXRrYsX8-sYph_g_Gt-0riU_",sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lang='hi',tests=[],qs=[],answers={},i=0,startedAt=0,timer=null,submitted=false,requestedTestId=new URLSearchParams(location.search).get('test'),sectionMode=false,sectionStartedAt=0,sectionStart=0,sectionEnd=0;
const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
async function submitVerifiedResultDirect(testId,answers,timeUsedSeconds){
  if(!navigator.onLine) throw new Error('Internet connection unavailable');
  let session=await sb.auth.getSession();
  if(session.error||!session.data||!session.data.session){
    session=await sb.auth.refreshSession();
  }
  if(session.error||!session.data||!session.data.session) throw new Error('Login session missing or expired');
  const token=session.data.session.access_token;
  const response=await fetch(SUPABASE_URL+'/functions/v1/submit-verified-result',{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+token},
    body:JSON.stringify({test_id:Number(testId),answers:answers||{},time_used_seconds:Number(timeUsedSeconds)||0})
  });
  const raw=await response.text();
  let payload=null;
  try{payload=JSON.parse(raw)}catch(e){}
  if(!response.ok||!payload||!payload.ok){
    throw new Error((payload&&payload.error)||('Result submission failed (HTTP '+response.status+')'));
  }
  return Object.assign({},payload.result,{
    review:Array.isArray(payload.review)?payload.review:[],
    section_performance:Array.isArray(payload.section_performance)?payload.section_performance:[],
    scoring:payload.scoring||{marks_per_correct:1,negative_per_wrong:0,max_score:payload.result.total_questions}
  });
}
function text(q,base,side){return q[''+base+'_'+lang]||q[base+'_'+side]||q[base]||''}

async function loadTests(){const {data,error}=await sb.from('tests').select('id,title,exam,duration_minutes,marks_per_correct,negative_per_wrong').order('created_at',{ascending:false});if(error)return $('tests').innerHTML='<option>Error loading tests</option>';tests=data||[];$('tests').innerHTML=tests.length?'<option value="">Select a test</option>'+tests.map(t=>'<option value="'+t.id+'">'+esc(t.exam+' — '+t.title)+'</option>').join(''):'<option value="">No verified tests yet</option>';if(requestedTestId&&tests.some(x=>String(x.id)===String(requestedTestId))){$('tests').value=String(requestedTestId);}}
async function start(){if(submitted)return;const id=Number($('tests').value);const t=tests.find(x=>x.id===id);if(!t)return;const {data:sessionData,error}=await sb.auth.getSession();if(error){alert('Login session check failed. Please login again.');return}if(!sessionData.session){location.href='auth.html';return}const r=await sb.from('questions').select('id,question,question_hi,question_en,option_a,option_a_hi,option_a_en,option_b,option_b_hi,option_b_en,option_c,option_c_hi,option_c_en,option_d,option_d_hi,option_d_en,explanation,explanation_hi,explanation_en,section').eq('test_id',id).order('id');if(r.error||!r.data?.length)return alert('इस test में questions उपलब्ध नहीं हैं।');qs=r.data;answers={};i=0;startedAt=Date.now();sectionMode=t.exam==='SSC CGL'&&qs.every(x=>x.section);sectionStartedAt=Date.now();setSectionBounds();$('chooser').classList.add('hidden');$('test').classList.remove('hidden');$('title').textContent=t.title+' · +'+(t.marks_per_correct??1)+' / −'+(t.negative_per_wrong??0);clearInterval(timer);timer=setInterval(tick,500);render()}
function opts(q){return [{c:q.option_a,h:q.option_a_hi,e:q.option_a_en},{c:q.option_b,h:q.option_b_hi,e:q.option_b_en},{c:q.option_c,h:q.option_c_hi,e:q.option_c_en},{c:q.option_d,h:q.option_d_hi,e:q.option_d_en}]}
function render(){const q=qs[i];if($('sectionInfo'))$('sectionInfo').textContent=sectionMode?'Section: '+(q.section||'')+' · 15-minute sectional timer':'';const question=q['question_'+lang]||q.question||'';$('q').innerHTML='<div class="q"><b>Q'+(i+1)+'.</b> '+esc(question)+'</div>'+opts(q).map((o,n)=>'<div class="opt '+(answers[q.id]===n?'sel':'')+'" onclick="choose('+n+')">'+String.fromCharCode(65+n)+'. '+esc(o[lang]||o.c||o.e||o.h)+'</div>').join('');$('pal').innerHTML=qs.map((x,n)=>'<button class="p '+(answers[x.id]!==undefined?'ans':'')+'" onclick="gotoQ('+n+')">'+(n+1)+'</button>').join('')}
function choose(n){answers[qs[i].id]=n;render()}function setSectionBounds(){if(!sectionMode){sectionStart=0;sectionEnd=qs.length-1;return}const s=qs[i].section;sectionStart=qs.findIndex(x=>x.section===s);let j=sectionStart;while(j+1<qs.length&&qs[j+1].section===s)j++;sectionEnd=j;sectionStartedAt=Date.now()}function tick(){if(submitted)return;let left;if(sectionMode){left=Math.max(0,900-Math.floor((Date.now()-sectionStartedAt)/1000));}else{left=Math.max(0,(tests.find(x=>x.id===Number($('tests').value))?.duration_minutes||30)*60-Math.floor((Date.now()-startedAt)/1000));}$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left===0){if(sectionMode){if(sectionEnd<qs.length-1){i=sectionEnd+1;setSectionBounds();render()}else submitTest()}else submitTest()}}function gotoQ(n){if(sectionMode&&(n<sectionStart||n>sectionEnd)){return}i=n;render()}function prev(){if(i>sectionStart){i--;render()}}function next(){if(i<sectionEnd){i++;render()}else if(sectionMode&&sectionEnd<qs.length-1){i=sectionEnd+1;setSectionBounds();render()}else submitTest()}
async function submitTest(){if(submitted)return;if(!qs.length)return;const ok=confirm('Test submit karna hai? Submit ke baad answers change nahi kar sakenge.');if(!ok)return;const sessionCheck=await sb.auth.getSession();if(sessionCheck.error||!sessionCheck.data.session){alert('Login session expired. Please login again.');location.href='auth.html';return}submitted=true;clearInterval(timer);const btn=$('submitBtn');if(btn){btn.disabled=true;btn.textContent='Submitting…';}const testId=Number($('tests').value),time=Math.floor((Date.now()-startedAt)/1000);try{if(!window.ExamBookVerifiedResults||typeof window.ExamBookVerifiedResults.submit!=='function'){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='verified-results.js?v=20260922-fallback-'+Date.now();s.onload=resolve;s.onerror=()=>reject(new Error('Result submission script could not be loaded'));document.head.appendChild(s)});}if(!window.ExamBookVerifiedResults||typeof window.ExamBookVerifiedResults.submit!=='function')throw new Error('Result submission module unavailable');const result=await window.ExamBookVerifiedResults.submit(testId,answers,time);$('test').classList.add('hidden');$('result').style.display='block';let review=result.review||[];let html='<div class="score">'+result.score+' / '+(result.scoring?.max_score??result.total_questions)+'</div><p>Scoring: +'+(result.scoring?.marks_per_correct??1)+' correct · −'+(result.scoring?.negative_per_wrong??0)+' wrong</p><h3>Section Performance</h3>'+((result.section_performance||[]).map(z=>'<p><b>'+esc(z.section)+'</b>: '+z.correct+'/'+z.attempted+' correct · Accuracy '+z.accuracy+'%</p>').join(''))+'<p>Attempted: '+result.attempted+' · Correct: '+result.correct+' · Wrong: '+result.wrong+' · Skipped: '+result.skipped+' · Accuracy: '+result.accuracy+'%</p><p>✅ Result server-side verified and saved to your account.</p><h3>Answer Review</h3>';html+=review.map((x,n)=>{let qq=x['question_'+lang]||x.question||'';let ex=x['explanation_'+lang]||x.explanation||'';let status=x.selected===null?'Skipped':(x.selected===x.correct_answer?'Correct':'Wrong');return '<div class="explain"><b>Q'+(n+1)+'. '+esc(qq)+'</b><br>Status: '+status+(x.selected===null?'':' · Your answer: '+String.fromCharCode(65+x.selected)+' · Correct: '+String.fromCharCode(65+x.correct_answer))+(ex?'<br>💡 '+esc(ex):'')+'</div>'}).join('');$('result').innerHTML=html+'<p><a href="index.html">← Home</a></p>'}catch(e){submitted=false;clearInterval(timer);const btn=$('submitBtn');if(btn){btn.disabled=false;btn.textContent='Submit Test';}alert('Result save नहीं हो सका: '+(e.message||e)+'\\n\\nकृपया test दोबारा submit करें।');}}
loadTests();
</script></body></html>
