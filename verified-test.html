<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamBook Pro — Verified Cloud Test</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="verified-results.js"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{position:sticky;top:0;z-index:10;background:#172554;color:#fff;padding:12px 16px}.bar{max-width:1050px;margin:auto;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-size:20px;font-weight:900}.right{display:flex;gap:7px;align-items:center}.btn{border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}.lang{background:#fff;color:#172033}.lang.active{background:#2563eb;color:#fff}.timer{background:#fff;color:#111827;border-radius:8px;padding:9px 12px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:18px}.panel,.intro{background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:20px;box-shadow:0 3px 14px #0000000a}.intro{background:linear-gradient(110deg,#eef2ff,#dbeafe);margin-bottom:15px}.select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;margin:10px 0}.q{font-size:20px;line-height:1.55;margin:15px 0}.opt{display:block;border:1px solid #dbe3ef;border-radius:9px;padding:13px;margin:9px 0;cursor:pointer}.opt.sel{background:#eff6ff;border-color:#2563eb}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.primary{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff;width:100%;margin-top:15px}.palette{display:flex;gap:6px;flex-wrap:wrap;margin-top:15px}.p{width:36px;height:34px;border:1px solid #94a3b8;background:#fff;border-radius:6px}.p.ans{background:#16a34a;color:#fff}.result{display:none}.score{font-size:42px;font-weight:900;color:#2563eb}.explain{background:#eff6ff;border-left:4px solid #2563eb;padding:12px;margin-top:12px}.hidden{display:none}@media(max-width:650px){.wrap{padding:12px}.q{font-size:18px}.actions{flex-direction:column}.right{width:100%;justify-content:flex-end}}</style>
</head><body><header class="top"><div class="bar"><div class="brand">☁️ ExamBook Pro — Verified Test</div><div class="right"><button id="hi" class="btn lang active" onclick="setLang('hi')">हिंदी</button><button id="en" class="btn lang" onclick="setLang('en')">English</button><span class="timer">⏱ <span id="clock">--:--</span></span></div></div></header>
<main class="wrap"><section id="chooser" class="intro"><h1>Verified Cloud Test</h1><p>इस page पर Admin द्वारा बनाए गए database tests चलेंगे। Score server पर questions के correct answers से calculate होगा।</p><select id="tests" class="select"><option value="">Loading tests...</option></select><button class="btn primary" onclick="start()">Start Test</button></section>
<section id="test" class="panel hidden"><h2 id="title"></h2><div id="q"></div><div class="actions"><button class="btn" onclick="prev()">← Previous</button><button class="btn primary" onclick="next()">Save & Next →</button></div><div id="pal" class="palette"></div><button class="btn red" onclick="submitTest()">Submit Test</button></section>
<section id="result" class="panel result"></section></main>
<script>
const SUPABASE_URL="https://abgigsjhdvsqehgdhbym.supabase.co",SUPABASE_KEY="sb_publishable_GGcJmjwLXRrYsX8-sYph_g_Gt-0riU_",sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let lang='hi',tests=[],qs=[],answers={},i=0,startedAt=0,timer=null,submitted=false;
const $=x=>document.getElementById(x);
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function setLang(x){lang=x;$('hi').classList.toggle('active',x==='hi');$('en').classList.toggle('active',x==='en');if(qs.length)render()}
function text(q,base,side){return q[''+base+'_'+lang]||q[base+'_'+side]||q[base]||''}
async function loadTests(){const {data,error}=await sb.from('tests').select('id,title,exam,duration_minutes').order('created_at',{ascending:false});if(error)return $('tests').innerHTML='<option>Error loading tests</option>';tests=data||[];$('tests').innerHTML=tests.length?'<option value="">Select a test</option>'+tests.map(t=>'<option value="'+t.id+'">'+esc(t.exam+' — '+t.title)+'</option>').join(''):'<option value="">No verified tests yet</option>'}
async function start(){if(submitted)return;const id=Number($('tests').value);const t=tests.find(x=>x.id===id);if(!t)return;const {data,error}=await sb.auth.getSession();if(error||!data.session){location.href='auth.html';return}const r=await sb.from('questions').select('id,question,question_hi,question_en,option_a,option_a_hi,option_a_en,option_b,option_b_hi,option_b_en,option_c,option_c_hi,option_c_en,option_d,option_d_hi,option_d_en,correct_answer,explanation,explanation_hi,explanation_en').eq('test_id',id).order('id');if(r.error||!r.data?.length)return alert('इस test में questions उपलब्ध नहीं हैं।');qs=r.data;answers={};i=0;startedAt=Date.now();$('chooser').classList.add('hidden');$('test').classList.remove('hidden');$('title').textContent=t.title;let seconds=(t.duration_minutes||30)*60;clearInterval(timer);timer=setInterval(()=>{const left=Math.max(0,seconds-Math.floor((Date.now()-startedAt)/1000));$('clock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(!left)submitTest()},500);render()}
function opts(q){return [{c:q.option_a,h:q.option_a_hi,e:q.option_a_en},{c:q.option_b,h:q.option_b_hi,e:q.option_b_en},{c:q.option_c,h:q.option_c_hi,e:q.option_c_en},{c:q.option_d,h:q.option_d_hi,e:q.option_d_en}]}
function render(){const q=qs[i];const question=q['question_'+lang]||q.question||'';$('q').innerHTML='<div class="q"><b>Q'+(i+1)+'.</b> '+esc(question)+'</div>'+opts(q).map((o,n)=>'<div class="opt '+(answers[q.id]===n?'sel':'')+'" onclick="choose('+n+')">'+String.fromCharCode(65+n)+'. '+esc(o[lang]||o.c||o.e||o.h)+'</div>').join('');$('pal').innerHTML=qs.map((x,n)=>'<button class="p '+(answers[x.id]!==undefined?'ans':'')+'" onclick="gotoQ('+n+')">'+(n+1)+'</button>').join('')}
function choose(n){answers[qs[i].id]=n;render()}function gotoQ(n){i=n;render()}function prev(){if(i>0){i--;render()}}function next(){if(i<qs.length-1){i++;render()}else submitTest()}
async function submitTest(){if(submitted)return;submitted=true;clearInterval(timer);const testId=Number($('tests').value),time=Math.floor((Date.now()-startedAt)/1000);try{const result=await ExamBookVerifiedResults.submit(testId,answers,time);$('test').classList.add('hidden');$('result').style.display='block';$('result').innerHTML='<div class="score">'+result.score+' / '+result.total_questions+'</div><p>Attempted: '+result.attempted+' · Correct: '+result.correct+' · Wrong: '+result.wrong+' · Skipped: '+result.skipped+' · Accuracy: '+result.accuracy+'%</p><p>✅ Result server-side verified and saved to your account.</p>'}catch(e){submitted=false;alert('Result save नहीं हो सका: '+(e.message||e));}}
loadTests();
</script></body></html>
