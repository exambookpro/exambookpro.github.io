<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoSupport — Creator Community</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--bg:#070b14;--card:#101827;--line:#243047;--text:#eef4ff;--muted:#8fa0ba;--accent:#6d5dfc;--good:#21c58b;--danger:#ff5d73}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#1b1740 0,#070b14 38%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{font-size:25px;font-weight:900}.brand span{color:#8d82ff}.sub{color:var(--muted);font-size:13px}.btn{background:var(--accent);color:#fff;padding:11px 15px;border-radius:11px;font-weight:700}.btn.alt{background:#182237}.btn.danger{background:#54202c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:rgba(16,24,39,.9);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px #0003}.hero{padding:30px}.hero h1{font-size:42px;margin:0 0 10px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 13px;border-radius:10px;background:#111b2c;color:#b9c5d9}.tab.on{background:var(--accent);color:#fff}.input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:#fff;outline:none;margin:7px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat b{font-size:28px;display:block}.video{display:flex;flex-direction:column;gap:10px}.thumb{height:145px;border-radius:12px;background:linear-gradient(135deg,#202d4b,#151b32);display:flex;align-items:center;justify-content:center;font-size:38px}.pill{font-size:11px;padding:5px 8px;border-radius:99px;background:#18243a;color:#aebee0}.msg{margin:10px 0;padding:10px;border-radius:10px;background:#102c25;color:#8ef0c8}.err{background:#351a22;color:#ff9cac}.hide{display:none}.auth{max-width:460px;margin:12vh auto}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;background:#0c1423;border:1px solid var(--line);border-radius:12px}.foot{margin:30px 0;color:#6f7e96;font-size:12px;text-align:center}@media(max-width:800px){.grid,.stats{grid-template-columns:1fr}.hero h1{font-size:31px}.top{align-items:flex-start}}
</style></head><body><div id="app"></div><script>
const SB_URL='https://abgigsjhdvsqehgdhbym.supabase.co',SB_KEY='sb_publishable_GGcJmjwLXRrYsX8-sYph_g_Gt-0riU_';
const sb=supabase.createClient(SB_URL,SB_KEY);let session=null,profile=null,view='home',videos=[],history=[],leader=[],adminVideos=[];
const orderTypes=[['discover','Discover / Browse'],['views','Views'],['likes','Likes'],['comments','Comments'],['watchtime','Watch Time'],['subscribers','Subscribers'],['shares','Shares']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const platform=url=>{try{let h=new URL(url).hostname.replace(/^www\./,'');return h.includes('youtube.com')||h.includes('youtu.be')?'YouTube':h.includes('instagram.com')?'Instagram':h.includes('facebook.com')||h.includes('fb.watch')?'Facebook':null}catch{return null}};
function toast(t,err=false){let e=document.getElementById('toast');e.className='msg '+(err?'err':'');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),3000)}
async function refresh(){if(!session){render();return}let p=await sb.from('vs_profiles').select('*').eq('id',session.user.id).maybeSingle();profile=p.data;let [v,h,l]=await Promise.all([sb.from('vs_videos').select('*,vs_profiles(display_name)').eq('status','approved').order('created_at',{ascending:false}),sb.from('vs_watch_sessions').select('*,vs_videos(title,url,platform)').eq('user_id',session.user.id).order('created_at',{ascending:false}),sb.from('vs_leaderboard').select('*').order('points',{ascending:false}).limit(100)]);videos=v.data||[];history=h.data||[];leader=l.data||[];if(profile?.role==='admin'){let a=await sb.from('vs_videos').select('*,vs_profiles(display_name)').order('created_at',{ascending:false});adminVideos=a.data||[]}render()}
function auth(){return `<div class="auth card"><div class="brand">Video<span>Support</span></div><p class="muted">Creator discovery & community support</p><div id="authmsg"></div><input id="email" class="input" type="email" placeholder="Email"><input id="pass" class="input" type="password" placeholder="Password"><input id="name" class="input" placeholder="Display name (signup)"><div class="row"><button class="btn" onclick="signup()">Create account</button><button class="btn alt" onclick="login()">Login</button></div><p class="muted" style="font-size:12px;margin-top:15px">Use genuine participation. External platform metrics remain controlled by YouTube, Instagram and Facebook.</p></div>`}
function nav(){return `<div class="top"><div><div class="brand">Video<span>Support</span></div><div class="sub">Creator Community</div></div><div class="row"><span class="pill">${esc(profile?.display_name||session.user.email)}</span><span class="pill">⭐ ${profile?.points||0} points</span><button class="btn alt" onclick="logout()">Logout</button></div></div><div class="tabs">${[['home','Home'],['discover','Discover'],['submit','Submit Video'],['history','Watch History'],['leader','Leaderboard'],['admin','Admin Panel']].filter(x=>x[0]!=='admin'||profile?.role==='admin').map(x=>`<button class="tab ${view===x[0]?'on':''}" onclick="view='${x[0]}';render()">${x[1]}</button>`).join('')}</div>`}
function home(){return `<section class="hero card"><div class="pill">COMMUNITY DISCOVERY</div><h1>Help creators discover<br>new videos.</h1><p class="muted">Create community support orders for public videos: Views/Discover, Likes, Comments, Watch Time, Subscribe/Follow, Share, Save and Full Watch. These describe requested community actions; external platform metrics remain controlled by the platform.</p><div class="row"><button class="btn" onclick="view='discover';render()">Discover videos</button><button class="btn alt" onclick="view='submit';render()">Submit a video</button></div></section><div class="stats"><div class="card stat"><span class="muted">Your points</span><b>${profile?.points||0}</b></div><div class="card stat"><span class="muted">Your sessions</span><b>${history.length}</b></div><div class="card stat"><span class="muted">Approved videos</span><b>${videos.length}</b></div></div><div class="card"><h3>How it works</h3><p class="muted">1. Submit a public YouTube, Instagram or Facebook video. 2. Discover approved community videos. 3. Open the original platform page. 4. Complete one community session per video. 5. Earn internal points.</p></div>`}
function discover(){let q=(document.getElementById('search')?.value||'').toLowerCase();let f=document.getElementById('filter')?.value||'All';let list=videos.filter(v=>(!q||v.title.toLowerCase().includes(q))&&(f==='All'||v.platform===f));return `<div class="card"><div class="row"><input id="search" class="input" style="flex:1;min-width:220px" placeholder="Search videos..." value="${esc(q)}" oninput="renderDiscover()"><select id="filter" class="input" style="width:150px" onchange="renderDiscover()"><option>All</option><option>YouTube</option><option>Instagram</option><option>Facebook</option></select></div></div><div id="discoverList" class="grid" style="margin-top:15px">${cards(list)}</div>`}
function cards(list){if(!list.length)return `<div class="card"><b>No videos found.</b><p class="muted">Be the first creator to submit a video.</p></div>`;return list.map(v=>`<div class="card video"><div class="thumb">▶</div><div class="row"><span class="pill">${esc(v.platform)}</span><span class="pill">${esc(v.order_type||'Views / Discover')}</span><span class="pill">Order: ${v.order_completed||0}/${v.order_target||0}</span><span class="pill">${v.order_target>0?Math.max(0,(v.order_target||0)-(v.order_completed||0)):0} left</span><span class="pill">+1 community point</span></div><h3 style="margin:0">${esc(v.title)}</h3><div class="muted">by ${esc(v.vs_profiles?.display_name||'Creator')}</div><button class="btn" onclick="watch('${v.id}')">Open & participate</button></div>`).join('')}
function submit(){return '<div class="card" style="max-width:720px"><h2>Create Support Order</h2><p class="muted">Choose the community action you want to request. These are community tasks only; no external-platform metric is guaranteed or sold.</p><input id="vtitle" class="input" placeholder="Video title"><input id="vurl" class="input" placeholder="https://youtube.com/... or Instagram/Facebook URL"><select id="otype" class="input"><option>Views / Discover</option><option>Likes</option><option>Comments</option><option>Watch Time</option><option>Subscribe / Follow</option><option>Share</option><option>Save</option><option>Full Watch</option></select><input id="otarget" class="input" type="number" min="1" max="1000000" placeholder="Community target (optional)"><input id="onote" class="input" maxlength="300" placeholder="Instructions / note (optional)"><button class="btn" onclick="submitVideo()">Create order for review</button></div>'}
function historyView(){return `<div class="card"><h2>Watch History</h2><div class="list">${history.length?history.map(h=>`<div class="item"><div><b>${esc(h.vs_videos?.title||'Video')}</b><div class="muted">${esc(h.vs_videos?.platform||'')} • ${new Date(h.created_at).toLocaleString()}</div></div><button class="btn alt" onclick="window.open('${esc(h.vs_videos?.url||'#')}','_blank')">Open</button></div>`).join(''):'<p class="muted">No completed sessions yet.</p>'}</div></div>`}
function leaderboard(){return `<div class="card"><h2>Leaderboard</h2><div class="list">${leader.map((x,i)=>`<div class="item"><div><b>#${i+1} ${esc(x.display_name)}</b></div><strong>${x.points||0} pts</strong></div>`).join('')}</div></div>`}
function admin(){return `<div class="card"><h2>Admin Panel</h2><p class="muted">Approve or reject submitted videos.</p><div class="list">${adminVideos.map(v=>`<div class="item"><div><b>${esc(v.title)}</b><div class="muted">${esc(v.platform)} • ${esc(v.status)} • ${esc(v.order_type||'Views / Discover')} • ${v.order_target?esc(v.order_target)+' target':''} • ${esc(v.vs_profiles?.display_name||'')}</div></div><div class="row">${v.status==='pending'?`<button class="btn" onclick="moderate('${v.id}','approved')">Approve</button><button class="btn danger" onclick="moderate('${v.id}','rejected')">Reject</button>`:''}</div></div>`).join('')}</div></div>`}
function render(){document.getElementById('app').innerHTML=!session?auth():`<div class="wrap">${nav()}<div id="toast" class="msg hide"></div>${view==='home'?home():view==='discover'?discover():view==='submit'?submit():view==='history'?historyView():view==='leader'?leaderboard():admin()}<div class="foot">VideoSupport is a community discovery/support layer. Be genuine, respect creators and follow platform rules.</div></div>`}
function renderDiscover(){let e=document.getElementById('discoverList');if(e){let q=(document.getElementById('search')?.value||'').toLowerCase(),f=document.getElementById('filter')?.value||'All';e.innerHTML=cards(videos.filter(v=>(!q||v.title.toLowerCase().includes(q))&&(f==='All'||v.platform===f)))}}
async function login(){let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:pass.value});if(r.error)toast(r.error.message,true)}
async function signup(){let r=await sb.auth.signUp({email:email.value.trim(),password:pass.value,data:{display_name:name.value.trim()||email.value.split('@')[0]}});if(r.error)toast(r.error.message,true);else toast('Account created. Check your email if confirmation is enabled.')} 
async function logout(){await sb.auth.signOut();session=null;profile=null;render()}
async function submitVideo(){let title=vtitle.value.trim(),url=vurl.value.trim(),p=platform(url),order_type=otype.value,order_target=otarget.value?Number(otarget.value):null,order_note=onote.value.trim();if(!title||!p||!order_types.length)return toast('Enter a title and a valid YouTube, Instagram or Facebook URL.',true);let r=await sb.from('vs_videos').insert({user_id:session.user.id,title,url,platform:p,status:'pending',order_type,order_target,order_note});if(r.error)toast(r.error.message,true);else{toast('Submitted for review.');vtitle.value='';vurl.value='';}}
async function watch(id){let v=videos.find(x=>x.id===id);if(!v)return;window.open(v.url,'_blank');toast('Video opened. Return here to complete your community session.');let done=await new Promise(resolve=>{let b=document.createElement('button');b.className='btn';b.textContent='Complete session';b.onclick=()=>{b.remove();resolve(true)};document.body.appendChild(b);b.style.position='fixed';b.style.right='20px';b.style.bottom='20px';});if(done){let r=await sb.rpc('vs_complete_watch',{p_video_id:id});if(r.error)toast(r.error.message,true);else{toast('Session completed. Point added.');await refresh()}}}
async function moderate(id,status){let r=await sb.from('vs_videos').update({status}).eq('id',id);if(r.error)toast(r.error.message,true);else{toast('Updated.');await refresh()}}
sb.auth.onAuthStateChange((_e,s)=>{session=s;setTimeout(refresh,0)});sb.auth.getSession().then(({data})=>{session=data.session;refresh()});
</script></body></html>
